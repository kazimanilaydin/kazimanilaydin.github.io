name: Profile cards

# Rebuilds the live cards (globe dashboard, contribution snake)
# and publishes them to the `output` branch that README.md points at.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dashboard and repo cards
        run: node scripts/build-dashboard.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          # Optional: comma-separated repos to render as cards (repo-<name>.svg).
          # FEATURED_REPOS: repo-one,repo-two
          HIDE_LANGUAGES: Jupyter Notebook

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b2a5c&color_dots=#e6edf3,#bdeffd,#6fd8f7,#26b3e0,#0d7fae
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0b1a33,#0d3b66,#1b6fa8,#2bb6e0,#3be8ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
