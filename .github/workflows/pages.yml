name: Deploy site

# Builds data/stats.json from the GitHub API and deploys the site to GitHub
# Pages. Settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Live stats
        # The site falls back to GitHub's public API if this step fails.
        continue-on-error: true
        run: node tools/build-stats.mjs data/stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html css js img fonts vendor _site/
          if [ -f data/stats.json ]; then cp data/stats.json _site/data/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
